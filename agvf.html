<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>School Management System - Login & Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="module">
    // Firebase imports and config (same as your provided code)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getDatabase, ref, push, set, onValue, remove, update, get, child 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { 
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8jNGeXyeTElnF1v9CDebG_Vs7xTKHz9Q",
      authDomain: "school-project-b8a8b.firebaseapp.com",
      databaseURL: "https://school-project-b8a8b-default-rtdb.firebaseio.com/",
      projectId: "school-project-b8a8b",
      storageBucket: "school-project-b8a8b.firebasestorage.app",
      messagingSenderId: "257031387670",
      appId: "1:257031387670:web:03c23c238abb5320145337",
      measurementId: "G-P8VWT2RG3M"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // DOM Elements
    let loginForm, logoutBtn, dashboard, userEmailSpan, messageForm, messagesList;

    window.addEventListener('DOMContentLoaded', () => {
      loginForm = document.getElementById('login-form');
      logoutBtn = document.getElementById('logout-btn');
      dashboard = document.getElementById('dashboard');
      userEmailSpan = document.getElementById('user-email');
      messageForm = document.getElementById('message-form');
      messagesList = document.getElementById('messages-list');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = loginForm.email.value.trim();
        const password = loginForm.password.value.trim();
        try {
          await signInWithEmailAndPassword(auth, email, password);
          loginForm.reset();
        } catch (error) {
          alert('Login failed: ' + error.message);
        }
      });

      logoutBtn.addEventListener('click', async () => {
        await signOut(auth);
      });

      messageForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = messageForm.message.value.trim();
        if (!msg) return;
        const user = auth.currentUser;
        if (!user) return alert('You must be logged in to send messages.');
        const messagesRef = ref(db, 'messages');
        const newMsgRef = push(messagesRef);
        await set(newMsgRef, {
          uid: user.uid,
          email: user.email,
          message: msg,
          timestamp: Date.now()
        });
        messageForm.reset();
      });

      // Auth state listener
      onAuthStateChanged(auth, user => {
        if (user) {
          loginForm.style.display = 'none';
          dashboard.style.display = 'block';
          userEmailSpan.textContent = user.email;
          loadMessages();
        } else {
          loginForm.style.display = 'block';
          dashboard.style.display = 'none';
          messagesList.innerHTML = '';
        }
      });
    });

    // Load messages from Firebase Realtime Database and listen for new messages
    function loadMessages() {
      const messagesRef = ref(db, 'messages');
      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        messagesList.innerHTML = '';
        if (data) {
          // Sort messages by timestamp ascending
          const sortedMessages = Object.values(data).sort((a,b) => a.timestamp - b.timestamp);
          sortedMessages.forEach(msg => {
            const li = document.createElement('li');
            li.textContent = `[${new Date(msg.timestamp).toLocaleTimeString()}] ${msg.email}: ${msg.message}`;
            messagesList.appendChild(li);
          });
          messagesList.scrollTop = messagesList.scrollHeight;
        }
      });
    }
  </script>
  <style>
    body {
      font-family: "DM Sans", system-ui, -apple-system;
      background: #0a0f2a;
      color: #e5e7eb;
      margin: 0; padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      background: #111a3c;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.8);
    }
    h1 {
      margin-bottom: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    input[type="email"],
    input[type="password"],
    textarea {
      padding: 0.5rem 0.75rem;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #0f172a;
      color: #e5e7eb;
      font-size: 1rem;
      outline: none;
      resize: none;
      transition: border-color 0.3s ease;
      width: 100%;
      box-sizing: border-box;
    }
    input[type="email"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: #4ade80;
      box-shadow: 0 0 5px #4ade80;
      background: #111a3c;
    }
    button {
      background: #4ade80;
      color: #022c22;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-size: 1rem;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #22c55e;
    }
    #dashboard {
      display: none;
    }
    #messages-list {
      list-style: none;
      padding: 0;
      max-height: 200px;
      overflow-y: auto;
      background: #0f172a;
      border-radius: 12px;
      margin-bottom: 1rem;
      border: 1px solid #374151;
    }
    #messages-list li {
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid #374151;
      font-size: 0.9rem;
      word-break: break-word;
    }
    #messages-list li:last-child {
      border-bottom: none;
    }
    .user-info {
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #9ca3af;
      text-align: center;
    }
    .logout-btn-container {
      text-align: center;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>School Management System</h1>

    <!-- Login Form -->
    <form id="login-form" aria-label="Login form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="admin@example.com" required autocomplete="username" />
      
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password" />
      
      <button type="submit">Login</button>
    </form>

    <!-- Dashboard -->
    <section id="dashboard" aria-label="User dashboard">
      <div class="user-info">
        Logged in as: <strong id="user-email"></strong>
      </div>
      <div class="logout-btn-container">
        <button id="logout-btn" aria-label="Logout">Logout</button>
      </div>

      <h2>Communication Module</h2>
      <ul id="messages-list" aria-live="polite" aria-relevant="additions"></ul>

      <form id="message-form" aria-label="Send message form">
        <label for="message">Send a message</label>
        <textarea id="message" name="message" rows="3" placeholder="Type your message here..." required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </div>
</body>
</html>
