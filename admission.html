<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভর্তি ফর্ম</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand"><i class="fas fa-school"></i> স্মার্ট স্কুল</div>
        <ul class="menu">
            <li><a href="index.html"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</a></li>
            <li>
                <button class="dropdown-btn"><span><i class="fas fa-user-graduate"></i> স্টুডেন্ট</span><i class="fas fa-caret-down"></i></button>
                <div class="dropdown-container" style="display: block;"> <a href="admission.html" style="color: white;">নতুন ভর্তি (Admission)</a>
                    <a href="student_list.html">স্টুডেন্ট লিস্ট</a>
                </div>
            </li>
            <li><a href="#"><i class="fas fa-cogs"></i> সেটিংস</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header>
            <div class="header-left">
                <div class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
                <h3>নতুন ছাত্র ভর্তি</h3>
            </div>
            <div class="user-info"><span>এডমিন</span><div class="user-avatar"><i class="fas fa-user"></i></div></div>
        </header>

        <div class="content-area" style="padding-top: 30px;">
            <div class="wrapper">
                <form>
                    <div class="form-grid">
                        <div><label>ছাত্রের নাম</label><input type="text" placeholder="নাম লিখুন"></div>
                        <div><label>পিতার নাম</label><input type="text" placeholder="পিতার নাম"></div>
                        <div>
                            <label>ক্লাস</label>
                            <select><option>Class 6</option><option>Class 7</option></select>
                        </div>
                        <div><label>মোবাইল নম্বর</label><input type="text" placeholder="017..."></div>
                        <div><label>জন্ম তারিখ</label><input type="date"></div>
                        <div><label>ছবি আপলোড</label><input type="file" style="padding: 7px;"></div>
                    </div>
                    <button type="submit" class="submit-btn"><i class="fas fa-save"></i> সেভ করুন</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        var dropdowns = document.getElementsByClassName("dropdown-btn");
        for (var i = 0; i < dropdowns.length; i++) {
            dropdowns[i].addEventListener("click", function() {
                this.classList.toggle("active");
                var content = this.nextElementSibling;
                content.style.display = content.style.display === "block" ? "none" : "block";
                this.querySelector(".fa-caret-down").classList.toggle("rotate");
            });
        }
    </script>
</body>
</html>
