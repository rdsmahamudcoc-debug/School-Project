<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আইডি কার্ড জেনারেটর</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* আপনার বিদ্যমান CSS এখানে থাকবে */
        .id-card-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .card-wrapper { display: flex; gap: 5px; margin-bottom: 20px; page-break-inside: avoid; }
        .id-card { width: 260px; height: 400px; background: #fff; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); position: relative; font-family: 'Segoe UI', sans-serif; border: 1px solid #ddd; overflow: hidden; }
        .card-header { background-color: #2c3e50; color: #fff; text-align: center; padding: 15px 10px; border-bottom-left-radius: 50% 20px; border-bottom-right-radius: 50% 20px; }
        .school-name { font-size: 14px; font-weight: bold; text-transform: uppercase; margin-top: 5px; }
        .photo-area { width: 100px; height: 100px; margin: -30px auto 10px; background: #fff; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; position: relative; }
        .photo-area img { width: 100%; height: 100%; object-fit: cover; }
        .student-name { text-align: center; font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .designation { text-align: center; font-size: 12px; background: #3498db; color: white; padding: 2px 10px; border-radius: 10px; display: inline-block; margin: 0 auto 15px; position: relative; left: 50%; transform: translateX(-50%); }
        .details-table { width: 90%; margin: 0 auto; font-size: 13px; }
        .details-table td { padding: 3px 0; border-bottom: 1px solid #eee; color: #555; }
        .details-table b { color: #333; margin-right: 5px; }
        .signature-area { position: absolute; bottom: 10px; right: 15px; text-align: center; }
        .signature-line { border-top: 1px solid #333; width: 80px; font-size: 10px; margin-top: 2px; }
        .card-back { text-align: center; padding: 20px; background: #fff; }
        .qr-code { margin: 15px auto; width: 90px; height: 90px; }
        .qr-code img { width: 100%; }
        .terms { font-size: 11px; color: #555; text-align: left; margin-top: 10px; line-height: 1.4; }
        .emergency-contact { margin-top: 15px; font-size: 12px; color: #333; border: 1px solid #e74c3c; padding: 10px; border-radius: 5px; background: #fdf2e9; text-align: left; }
        .validity { position: absolute; bottom: 0; left: 0; width: 100%; background: #e74c3c; color: white; font-size: 12px; padding: 5px 0; text-align: center; }

        @media print {
            .sidebar, header, .search-section, .btn-action { display: none !important; }
            .id-card-container { display: block; }
            .card-wrapper { display: inline-flex; margin: 10px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="brand"><i class="fas fa-school"></i> স্মার্ট স্কুল</div>
        <ul class="menu">
            <li><a href="index.html"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</a></li>
            <li><a href="student_list.html"><i class="fas fa-user-graduate"></i> স্টুডেন্ট লিস্ট</a></li>
            <li><a href="id_card.html" style="background: #1a252f; border-left: 4px solid #3498db; color: white;"><i class="fas fa-id-card"></i> আইডি কার্ড</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header>
            <div class="header-left">
                <div class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
                <h3>আইডি কার্ড জেনারেশন</h3>
            </div>
        </header>

        <div class="content-area" style="padding-top: 30px;">
            <div class="wrapper search-section" style="margin-bottom: 30px;">
                <h4 style="margin-bottom: 15px;">ক্লাস নির্বাচন করুন</h4>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <select id="classFilter" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="">সকল ক্লাস</option>
                        <option value="Class 6">Class 6</option>
                        <option value="Class 7">Class 7</option>
                        <option value="Class 8">Class 8</option>
                        <option value="Class 9">Class 9</option>
                        <option value="Class 10">Class 10</option>
                    </select>
                    <button id="loadBtn" class="submit-btn" style="margin-top: 0; cursor:pointer;"><i class="fas fa-sync-alt"></i> কার্ড লোড করুন</button>
                    <button onclick="window.print()" class="submit-btn" style="background: #34495e; margin-top: 0; cursor:pointer;"><i class="fas fa-print"></i> প্রিন্ট</button>
                </div>
            </div>

            <div class="id-card-container" id="cardContainer">
                <p style="color: #777;">কার্ড দেখতে ক্লাস সিলেক্ট করে 'লোড করুন' বাটনে চাপ দিন।</p>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
    </script>

    <script type="module">
        import { db, ref, onValue } from './firebase-config.js';

        const cardContainer = document.getElementById('cardContainer');
        const loadBtn = document.getElementById('loadBtn');

        loadBtn.addEventListener('click', function() {
            const selectedClass = document.getElementById('classFilter').value;
            const studentsRef = ref(db, 'students');

            cardContainer.innerHTML = '<p>ডাটা লোড হচ্ছে...</p>';

            onValue(studentsRef, (snapshot) => {
                const data = snapshot.val();
                cardContainer.innerHTML = ''; 

                if (data) {
                    let hasData = false;
                    Object.values(data).forEach((student) => {
                        if (selectedClass === "" || student.className === selectedClass) {
                            hasData = true;
                            
                            // student.photo ভেরিয়েবলটি ব্যবহার করা হয়েছে
                            const cardHTML = `
                                <div class="card-wrapper">
                                    <div class="id-card">
                                        <div class="card-header">
                                            <i class="fas fa-graduation-cap" style="font-size: 30px;"></i>
                                            <div class="school-name">স্মার্ট হাই স্কুল অ্যান্ড কলেজ</div>
                                        </div>
                                        <div class="photo-area">
                                            <img src="${student.photo || 'https://via.placeholder.com/100?text=No+Photo'}" 
                                                 onerror="this.src='https://via.placeholder.com/100?text=Error'">
                                        </div>
                                        <div class="student-name">${student.name}</div>
                                        <div class="designation">Student</div>
                                        <table class="details-table">
                                            <tr><td><b>ID No:</b> ${student.id ? student.id.substring(1, 8) : 'N/A'}</td></tr>
                                            <tr><td><b>Class:</b> ${student.className}</td></tr>
                                            <tr><td><b>Roll:</b> ${student.roll || '-'}</td></tr>
                                            <tr><td><b>Blood Group:</b> ${student.bloodGroup || '-'}</td></tr>
                                            <tr><td><b>Phone:</b> ${student.phone}</td></tr>
                                        </table>
                                        <div class="signature-area">
                                            <div style="font-family: cursive; font-size:12px;">Principal</div> 
                                            <div class="signature-line">Principal's Sign</div>
                                        </div>
                                    </div>

                                    <div class="id-card card-back">
                                        <div style="font-weight: bold; color: #2c3e50;">নির্দেশাবলী</div>
                                        <div class="qr-code">
                                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${student.id}" alt="QR">
                                        </div>
                                        <div class="terms">
                                            <ul>
                                                <li>এই কার্ডটি স্কুলের সম্পত্তি।</li>
                                                <li>হারিয়ে গেলে অফিসে জানাতে হবে।</li>
                                            </ul>
                                        </div>
                                        <div class="emergency-contact">
                                            <b>অভিভাবক:</b> ${student.fatherName}<br>
                                            <b>ঠিকানা:</b> ${student.address || 'N/A'}<br>
                                            <b>জরুরি যোগাযোগ:</b> ${student.phone}
                                        </div>
                                        <div class="validity">Valid Upto: Dec 2026</div>
                                    </div>
                                </div>
                            `;
                            cardContainer.innerHTML += cardHTML;
                        }
                    });

                    if (!hasData) cardContainer.innerHTML = '<p style="color:red;">এই ক্লাসের কোনো ছাত্র পাওয়া যায়নি।</p>';
                } else {
                    cardContainer.innerHTML = '<p style="color:red;">ডাটাবেসে কোনো ছাত্র নেই।</p>';
                }
            });
        });
    </script>
</body>
</html>
