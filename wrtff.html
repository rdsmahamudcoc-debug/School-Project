<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>Fee Management - EduSphere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: "DM Sans", system-ui, -apple-system;
      background: #0a0f2a;
      color: #e5e7eb;
      margin: 0; padding: 0;
    }
    .container {
      max-width: 1000px;
      margin: 2rem auto;
      background: #111a3c;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.8);
    }
    h1 {
      margin-bottom: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      color: #d1d5db;
    }
    th, td {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid #374151;
      text-align: left;
    }
    th {
      background: #1e293b;
      font-weight: 600;
    }
    .btn {
      background: #4ade80;
      color: #022c22;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.06em;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #22c55e;
    }
    .filter-row {
      margin-bottom: 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-row label {
      font-weight: 600;
      color: #9ca3af;
    }
    .filter-row select, .filter-row input {
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #374151;
      background: #0f172a;
      color: #e5e7eb;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s ease;
    }
    .filter-row select:focus, .filter-row input:focus {
      border-color: #4ade80;
      box-shadow: 0 0 5px #4ade80;
      background: #111a3c;
    }
  </style>
</head>
<body>
  <div class="container" role="main">
    <h1>Fee Management</h1>

    <div class="filter-row" aria-label="Filter fees">
      <label for="classFilter">Class:</label>
      <select id="classFilter" name="classFilter">
        <option value="">All</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>

      <label for="statusFilter">Status:</label>
      <select id="statusFilter" name="statusFilter">
        <option value="">All</option>
        <option value="paid">Paid</option>
        <option value="due">Due</option>
      </select>

      <label for="searchInput">Search Student:</label>
      <input type="text" id="searchInput" placeholder="Enter student name or ID" />
    </div>

    <table aria-label="Fee records table">
      <thead>
        <tr>
          <th>Student</th>
          <th>Class</th>
          <th>Fee Amount</th>
          <th>Status</th>
          <th>Last Payment Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="feeTableBody">
        <tr>
          <td>Sadia Rahman</td>
          <td>8</td>
          <td>৳ 50,000</td>
          <td style="color:#22c55e; font-weight:600;">Paid</td>
          <td>2025-12-15</td>
          <td><button class="btn">View Details</button></td>
        </tr>
        <tr>
          <td>Rafiul Karim</td>
          <td>7</td>
          <td>৳ 50,000</td>
          <td style="color:#f87171; font-weight:600;">Due</td>
          <td>2025-10-10</td>
          <td><button class="btn">Send Reminder</button></td>
        </tr>
        <tr>
          <td>Mahin Hasan</td>
          <td>9</td>
          <td>৳ 50,000</td>
          <td style="color:#22c55e; font-weight:600;">Paid</td>
          <td>2025-11-20</td>
          <td><button class="btn">View Details</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
